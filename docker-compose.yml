version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: mongoDB
    ports:
      - "27017:27017"
  
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
  
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env
    